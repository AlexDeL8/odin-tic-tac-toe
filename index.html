<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <script defer src="./script.js"></script>
    <script
      src="https://kit.fontawesome.com/dbafa2a695.js"
      crossorigin="anonymous"
    ></script>

    <title>Odin Tic-Tac-Toe</title>
  </head>
  <body>
    <header>
      <h1>Tic-Tac-Toe</h1>
      <h2>Interact below to start and configure your game!</h2>
    </header>
    <main>
      <div id="gameContainer">
        <div id="player1Section" class="playerSection">
          <div class="playerInfoContainer">
            <p id="player1Name" class="playerName">Player 1</p>
            <p class="playerWinsLabel">
              Wins:
              <span id="player1WinsNumber" class="playerWinsNumber">0</span>
            </p>
          </div>
          <div class="playerMarkerContainer">
            <p class="playerMarker player1Marker">X</p>
            <button id="player1MarkerBtn" class="secondaryBtn changeMarkerBtn">
              Change Marker
            </button>
          </div>
        </div>
        <div id="gameBoardSection">
          <div id="gameBoard" class="disabled">
            <div
              id="gameBoardCol1"
              data-cell-row="0"
              data-cell-col="0"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol2"
              data-cell-row="0"
              data-cell-col="1"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol3"
              data-cell-row="0"
              data-cell-col="2"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol4"
              data-cell-row="1"
              data-cell-col="0"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol5"
              data-cell-row="1"
              data-cell-col="1"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol6"
              data-cell-row="1"
              data-cell-col="2"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol7"
              data-cell-row="2"
              data-cell-col="0"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol8"
              data-cell-row="2"
              data-cell-col="1"
              class="gameBoardCell"
            ></div>
            <div
              id="gameBoardCol9"
              data-cell-row="2"
              data-cell-col="2"
              class="gameBoardCell"
            ></div>
          </div>
        </div>
        <div id="player2Section" class="playerSection">
          <div class="playerInfoContainer">
            <p id="player2Name" class="playerName">Player 2</p>
            <p class="playerWinsLabel">
              Wins:
              <span id="player2WinsNumber" class="playerWinsNumber">0</span>
            </p>
          </div>
          <div class="playerMarkerContainer">
            <p class="playerMarker player2Marker">O</p>
            <button id="player2MarkerBtn" class="secondaryBtn changeMarkerBtn">
              Change Marker
            </button>
          </div>
        </div>
      </div>
      <div id="gameInfo">
        <button id="newGameBtn" class="primaryBtn">New Game</button>
        <p id="winnerLabel"></p>
        <p id="winnerName"></p>
      </div>
    </main>
    <footer>
      <p>
        Created by
        <a href="https://github.com/AlexDeL8" target="_blank" rel="nofollow"
          >Alex De Luca<i class="fa-brands fa-github"></i
        ></a>
      </p>
    </footer>
  </body>
</html>
